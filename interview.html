<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Interview</title>
<script src="config.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 10px;
    text-align: start;
}

#chat {
    width: 100%;
    overflow-wrap: break-word;
    word-wrap: break-word;
    direction: inherit;
    text-align: start;
}

.chat-message {
    direction: inherit;
    text-align: start;
    unicode-bidi: isolate;
}

.message-label,
.message-content {
    unicode-bidi: isolate;
}

.message-content {
    white-space: pre-wrap;
}

textarea {
    width: 100%;
    box-sizing: border-box;
    direction: inherit;
    text-align: start;
}

button {
    margin-top: 10px;
}
</style>

</head>

<body>

<h1 id="interviewTitle">AI Interview</h1>

<div id="chat">
    <p class="chat-message">
    <b><bdi id="aiLabel" class="message-label" dir="auto">AI</bdi>:</b>
    <bdi id="interviewWelcome" class="message-content">Welcome to the interview.</bdi>
</p>
</div>

<br>

<textarea id="message" rows="4" style="width:100%; box-sizing:border-box; font-size:16px;"></textarea>

<button id="sendButton" onclick="sendMessage()">Send</button>

<script>

let history = [];

const participantId =
    localStorage.getItem("participantId") ||
    ("P" + Date.now());

localStorage.setItem("participantId", participantId);

const SESSION_ID_STORAGE_KEY = "interviewSessionId";
const SESSION_PARTICIPANT_STORAGE_KEY = "interviewSessionParticipantId";
const SESSION_LANGUAGE_STORAGE_KEY = "interviewSessionLanguage";
const language = localStorage.getItem("language") || "en";
const storedSessionParticipant = localStorage.getItem(
    SESSION_PARTICIPANT_STORAGE_KEY
);
const storedSessionLanguage = localStorage.getItem(
    SESSION_LANGUAGE_STORAGE_KEY
);
let sessionId = storedSessionParticipant === participantId
    && storedSessionLanguage === language
    ? localStorage.getItem(SESSION_ID_STORAGE_KEY)
    : null;

if (!sessionId) {
    sessionId = "S" + Date.now();
}

function persistSessionId() {
    localStorage.setItem(SESSION_ID_STORAGE_KEY, sessionId);
    localStorage.setItem(
        SESSION_PARTICIPANT_STORAGE_KEY,
        participantId
    );
    localStorage.setItem(SESSION_LANGUAGE_STORAGE_KEY, language);
    sessionStorage.setItem("sessionId", sessionId);
}

persistSessionId();
async function sendMessage() {

    const messageBox = document.getElementById("message");
    const sendButton = document.getElementById("sendButton");
    const message = messageBox.value.trim();

    if (!message) return;

    const requestHistory = [...history, {
        role: "user",
        content: message
    }];

    messageBox.value = "";
    sendButton.disabled = true;

    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },

         body: JSON.stringify({
        participantId,
        sessionId,
        language,
        message,
        history: requestHistory
    })
        });

        let data = {};

        try {
            data = await response.json();
        } catch (parseError) {
            console.error("Interview response could not be parsed.", parseError);
        }

        const reply = typeof data.reply === "string"
            ? data.reply.trim()
            : "";

        if (response.status === 409
            && data.code === "SESSION_EXPIRED"
            && typeof data.sessionId === "string"
            && data.sessionId.trim()) {
            sessionId = data.sessionId.trim();
            persistSessionId();
            history = [];
            messageBox.value = message;
            appendChatMessage(
                t.ai,
                t.session_expired ||
                    "Your previous session expired after a period of inactivity. A new continuation session is ready; please send your message again."
            );
            return;
        }

        if (!response.ok || !reply) {
            throw new Error("Interview request did not return a usable reply.");
        }

        appendChatMessage(t.participant, message);
        appendChatMessage(t.ai, reply);

        history = [...requestHistory, {
            role: "assistant",
            content: reply
        }];
    } catch (error) {
        console.error("Interview request failed.", error);
        appendChatMessage(
            t.ai,
            t.interview_error ||
                "We could not continue the interview. Please try again."
        );
        messageBox.value = message;
    } finally {
        sendButton.disabled = false;
    }
}

function appendChatMessage(label, content) {

    const messageContent = typeof content === "string"
        ? content.trim()
        : "";

    if (!messageContent) {
        return false;
    }

    const messageDirection = getLanguageDirection(language);

    const paragraph = document.createElement("p");
    paragraph.className = "chat-message";
    paragraph.lang = language;
    paragraph.dir = messageDirection;

    const boldLabel = document.createElement("b");
    const labelText = document.createElement("bdi");
    labelText.className = "message-label";
    labelText.dir = "auto";
    labelText.textContent = label;
    boldLabel.appendChild(labelText);
    boldLabel.appendChild(document.createTextNode(":"));

    const messageText = document.createElement("bdi");
    messageText.className = "message-content";
    messageText.dir = messageDirection;
    messageText.textContent = messageContent;

    paragraph.appendChild(boldLabel);
    paragraph.appendChild(document.createTextNode(" "));
    paragraph.appendChild(messageText);

    document.getElementById("chat").appendChild(paragraph);

    return true;
}

</script>
<script>

let t = {};

async function loadTranslations() {

    const language =
        localStorage.getItem("language") || "en";

    const response =
        await fetch(`translations/${language}.json`);

    t = await response.json();

    const direction = getLanguageDirection(language);

    document.documentElement.lang = language;
    document.documentElement.dir = direction;

    const chat = document.getElementById("chat");
    chat.lang = language;
    chat.dir = direction;

    const messageBox = document.getElementById("message");
    messageBox.lang = language;
    messageBox.dir = direction;

    const appTitle = formatAppName(t.app_title || "{app_name}");

    document.title = appTitle;

    document.getElementById("interviewTitle").textContent =
        appTitle;

    document.getElementById("aiLabel").textContent =
        t.ai;

    document.getElementById("interviewWelcome").textContent =
        t.interview_welcome;
    document.getElementById("interviewWelcome").dir = direction;

    document.getElementById("sendButton").textContent =
        t.send;

    document.getElementById("returnLanguageButton").textContent =
        t.return_language;

}

loadTranslations();

</script>
<br><br>

<a href="index.html">
   <button id="returnLanguageButton">
    Return to Language Selection
</button>
</a>

</body>
</html>
