<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Interview</title>
<script src="config.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 10px;
    text-align: start;
}

#chat {
    width: 100%;
    overflow-wrap: break-word;
    word-wrap: break-word;
    direction: inherit;
    text-align: start;
}

.chat-message {
    direction: inherit;
    text-align: start;
    unicode-bidi: isolate;
}

.message-label,
.message-content {
    unicode-bidi: isolate;
}

.message-content {
    white-space: pre-wrap;
}

textarea {
    width: 100%;
    box-sizing: border-box;
    direction: inherit;
    text-align: start;
}

button {
    margin-top: 10px;
}
</style>

</head>

<body>

<h1 id="interviewTitle">AI Interview</h1>

<div id="chat">
    <p class="chat-message">
    <b><bdi id="aiLabel" class="message-label" dir="auto">AI</bdi>:</b>
    <bdi id="interviewWelcome" class="message-content">Welcome to the interview.</bdi>
</p>
</div>

<br>

<textarea id="message" rows="4" style="width:100%; box-sizing:border-box; font-size:16px;"></textarea>

<button id="sendButton" onclick="sendMessage()">Send</button>
<!-- Voice transcription section goes here -->
 <div id="voiceTranscriptionSection">
    <p id="voiceSpeakTitle">🎙 Speak your answer</p>

<div id="voiceDisclosure">
    <p id="voiceDisclosureText"></p>

    <label>
        <input
            type="checkbox"
            id="voiceDisclosureAcknowledgement"
        >
        <span id="voiceDisclosureAgree"></span>
    </label>
</div>

    <button id="startRecordingButton" disabled>Start recording</button>
    <button id="stopRecordingButton" disabled>Stop</button>

    <br><br>

    <textarea
        id="transcriptionBox"
        rows="6"
        placeholder="Your transcription will appear here..."
    ></textarea>

    <br>

    <button id="readBackButton" disabled>▶ Read back</button>
    <button id="insertTranscriptButton">Insert into interview</button>
</div>
    
<script>

let history = [];
    
let mediaRecorder;
let audioChunks = [];
let recordedAudioBlob = null;

const startRecordingButton =
    document.getElementById("startRecordingButton");

const stopRecordingButton =
    document.getElementById("stopRecordingButton");

const readBackButton =
    document.getElementById("readBackButton");

    const insertTranscriptButton =
    document.getElementById("insertTranscriptButton");

const transcriptionBox =
    document.getElementById("transcriptionBox");

const voiceDisclosureAcknowledgement =
    document.getElementById(
        "voiceDisclosureAcknowledgement"
    );

voiceDisclosureAcknowledgement.addEventListener(
    "change",
    () => {
        const acknowledged =
            voiceDisclosureAcknowledgement.checked;

        startRecordingButton.disabled =
            !acknowledged;

        readBackButton.disabled =
            !acknowledged;
    }
);

insertTranscriptButton.addEventListener(
    "click",
    () => {
        const transcript =
            transcriptionBox.value.trim();

        if (!transcript) {
            return;
        }

        const messageBox =
            document.getElementById("message");

        messageBox.value = transcript;
        messageBox.focus();
    }
);

const textToSpeechLanguageCodes = {
    en: "en-US",
    zh: "cmn-CN"
};

let currentPlaybackAudio = null;

readBackButton.addEventListener(
    "click",
    async () => {
        const text =
            transcriptionBox.value.trim();

        if (!text) {
            return;
        }

        const selectedLanguage =
            localStorage.getItem("language") || "en";

        const languageCode =
            textToSpeechLanguageCodes[selectedLanguage];

        if (!languageCode) {
            console.error(
                "Text-to-Speech is not configured for this language yet."
            );
            return;
        }

        try {
            readBackButton.disabled = true;

            const response =
                await fetch("/api/synthesize", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        text,
                        languageCode
                    })
                });

            const data =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    "Speech playback failed."
                );
            }

            if (currentPlaybackAudio) {
                currentPlaybackAudio.pause();
                currentPlaybackAudio = null;
            }

            currentPlaybackAudio =
                new Audio(
                    `data:${data.mimeType};base64,${data.audioBase64}`
                );

            await currentPlaybackAudio.play();

        } catch (error) {
            console.error(
                "Read-back failed:",
                error
            );
        } finally {
            readBackButton.disabled =
                !voiceDisclosureAcknowledgement.checked;
        }
    }
);
    
startRecordingButton.addEventListener("click", async () => {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        audioChunks = [];

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.addEventListener("dataavailable", event => {
            if (event.data.size > 0) {
                audioChunks.push(event.data);
            }
        });

const speechLanguageCodes = {
    en: "en-US",
    zh: "cmn-Hans-CN"
};

function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onloadend = () => {
            const result = reader.result;

            if (typeof result !== "string") {
                reject(
                    new Error(
                        "Audio could not be converted."
                    )
                );
                return;
            }

            resolve(result.split(",")[1]);
        };

        reader.onerror = reject;

        reader.readAsDataURL(blob);
    });
}

async function transcribeRecordedAudio() {
    if (!recordedAudioBlob) {
        return;
    }

    const selectedLanguage =
        localStorage.getItem("language") || "en";

    const languageCode =
        speechLanguageCodes[selectedLanguage];

    if (!languageCode) {
        throw new Error(
            "Speech recognition is not configured for this language yet."
        );
    }

    const audioBase64 =
        await blobToBase64(recordedAudioBlob);

    const response = await fetch("/api/transcribe", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            audioBase64,
            languageCode,
            mimeType: recordedAudioBlob.type
        })
    });

    const data = await response.json();

    if (!response.ok) {
        throw new Error(
            data.error || "Transcription failed."
        );
    }

    document.getElementById(
        "transcriptionBox"
    ).value = data.transcript || "";
}
        
      mediaRecorder.addEventListener("stop", async () => {
    recordedAudioBlob = new Blob(
        audioChunks,
        { type: mediaRecorder.mimeType }
    );

    stream.getTracks().forEach(track => track.stop());

    try {
        await transcribeRecordedAudio();
    } catch (error) {
        console.error(
            "Transcription request failed:",
            error
        );
    }
});

        mediaRecorder.start();

        startRecordingButton.disabled = true;
        stopRecordingButton.disabled = false;

       startRecordingButton.textContent =
    t.recording;

    } catch (error) {
        console.error("Microphone access failed:", error);

        alert(
            "Microphone access could not be started. Please allow microphone access and try again."
        );
    }
});

stopRecordingButton.addEventListener("click", () => {
    if (
        mediaRecorder &&
        mediaRecorder.state === "recording"
    ) {
        mediaRecorder.stop();

        startRecordingButton.disabled = false;
        stopRecordingButton.disabled = true;

        startRecordingButton.textContent =
    t.start_recording;
    }
});
    
    
const participantId =
    localStorage.getItem("participantId") ||
    ("P" + Date.now());

localStorage.setItem("participantId", participantId);

const SESSION_ID_STORAGE_KEY = "interviewSessionId";
const SESSION_PARTICIPANT_STORAGE_KEY = "interviewSessionParticipantId";
const SESSION_LANGUAGE_STORAGE_KEY = "interviewSessionLanguage";
const language = localStorage.getItem("language") || "en";
const storedSessionParticipant = localStorage.getItem(
    SESSION_PARTICIPANT_STORAGE_KEY
);
const storedSessionLanguage = localStorage.getItem(
    SESSION_LANGUAGE_STORAGE_KEY
);
let sessionId = storedSessionParticipant === participantId
    && storedSessionLanguage === language
    ? localStorage.getItem(SESSION_ID_STORAGE_KEY)
    : null;

if (!sessionId) {
    sessionId = "S" + Date.now();
}

function persistSessionId() {
    localStorage.setItem(SESSION_ID_STORAGE_KEY, sessionId);
    localStorage.setItem(
        SESSION_PARTICIPANT_STORAGE_KEY,
        participantId
    );
    localStorage.setItem(SESSION_LANGUAGE_STORAGE_KEY, language);
    sessionStorage.setItem("sessionId", sessionId);
}

persistSessionId();
async function sendMessage() {

    const messageBox = document.getElementById("message");
    const sendButton = document.getElementById("sendButton");
    const message = messageBox.value.trim();

    if (!message) return;

    const requestHistory = [...history, {
        role: "user",
        content: message
    }];

    messageBox.value = "";
    sendButton.disabled = true;

    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },

         body: JSON.stringify({
        participantId,
        sessionId,
        language,
        message,
        history: requestHistory
    })
        });

        let data = {};

        try {
            data = await response.json();
        } catch (parseError) {
            console.error("Interview response could not be parsed.", parseError);
        }

        const reply = typeof data.reply === "string"
            ? data.reply.trim()
            : "";

        if (response.status === 409
            && data.code === "SESSION_EXPIRED"
            && typeof data.sessionId === "string"
            && data.sessionId.trim()) {
            sessionId = data.sessionId.trim();
            persistSessionId();
            history = [];
            messageBox.value = message;
            appendChatMessage(
                t.ai,
                t.session_expired ||
                    "Your previous session expired after a period of inactivity. A new continuation session is ready; please send your message again."
            );
            return;
        }

        if (!response.ok || !reply) {
            throw new Error("Interview request did not return a usable reply.");
        }

        appendChatMessage(t.participant, message);
        appendChatMessage(t.ai, reply);

        history = [...requestHistory, {
            role: "assistant",
            content: reply
        }];
    } catch (error) {
        console.error("Interview request failed.", error);
        appendChatMessage(
            t.ai,
            t.interview_error ||
                "We could not continue the interview. Please try again."
        );
        messageBox.value = message;
    } finally {
        sendButton.disabled = false;
    }
}

function appendChatMessage(label, content) {

    const messageContent = typeof content === "string"
        ? content.trim()
        : "";

    if (!messageContent) {
        return false;
    }

    const messageDirection = getLanguageDirection(language);

    const paragraph = document.createElement("p");
    paragraph.className = "chat-message";
    paragraph.lang = language;
    paragraph.dir = messageDirection;

    const boldLabel = document.createElement("b");
    const labelText = document.createElement("bdi");
    labelText.className = "message-label";
    labelText.dir = "auto";
    labelText.textContent = label;
    boldLabel.appendChild(labelText);
    boldLabel.appendChild(document.createTextNode(":"));

    const messageText = document.createElement("bdi");
    messageText.className = "message-content";
    messageText.dir = messageDirection;
    messageText.textContent = messageContent;

    paragraph.appendChild(boldLabel);
    paragraph.appendChild(document.createTextNode(" "));
    paragraph.appendChild(messageText);

    document.getElementById("chat").appendChild(paragraph);

    return true;
}

</script>
<script>

let t = {};

async function loadTranslations() {

    const language =
        localStorage.getItem("language") || "en";

    const response =
        await fetch(`translations/${language}.json`);

    t = await response.json();

    const direction = getLanguageDirection(language);

    document.documentElement.lang = language;
    document.documentElement.dir = direction;

    const chat = document.getElementById("chat");
    chat.lang = language;
    chat.dir = direction;

    const messageBox = document.getElementById("message");
    messageBox.lang = language;
    messageBox.dir = direction;

    const appTitle = formatAppName(t.app_title || "{app_name}");

    document.title = appTitle;

    document.getElementById("interviewTitle").textContent =
        appTitle;

    document.getElementById("aiLabel").textContent =
        t.ai;

    document.getElementById("interviewWelcome").textContent =
        t.interview_welcome;
    document.getElementById("interviewWelcome").dir = direction;

    document.getElementById("sendButton").textContent =
        t.send;

document.getElementById("voiceSpeakTitle").textContent =
    t.voice_speak_title;

document.getElementById("voiceDisclosureText").textContent =
    t.voice_disclosure;

document.getElementById("voiceDisclosureAgree").textContent =
    t.voice_disclosure_agree;

document.getElementById("startRecordingButton").textContent =
    t.start_recording;

document.getElementById("stopRecordingButton").textContent =
    t.stop_recording;

document.getElementById("readBackButton").textContent =
    t.read_back;

document.getElementById("insertTranscriptButton").textContent =
    t.insert_transcript;

 document.getElementById("transcriptionBox").placeholder =
    t.transcription_placeholder;   
    document.getElementById("returnLanguageButton").textContent =
        t.return_language;

}

loadTranslations();

</script>
<br><br>

<a href="index.html">
   <button id="returnLanguageButton">
    Return to Language Selection
</button>
</a>

</body>
</html>
