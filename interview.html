<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Interview</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 10px;
}

#chat {
    width: 100%;
    overflow-wrap: break-word;
    word-wrap: break-word;
}

textarea {
    width: 100%;
    box-sizing: border-box;
}

button {
    margin-top: 10px;
}
</style>

</head>

<body>

<h1>Interview Quest</h1>

<div id="chat">
    <p><b>AI:</b> Welcome to the interview.</p>
</div>

<br>

<textarea id="message" rows="4" style="width:100%; box-sizing:border-box; font-size:16px;"></textarea>

<button onclick="sendMessage()">Send</button>

<script>

let history = [];

const participantId =
    localStorage.getItem("participantId") ||
    ("P" + Date.now());

localStorage.setItem("participantId", participantId);

const sessionId = "S" + Date.now();

sessionStorage.setItem("sessionId", sessionId);
    const language =
    localStorage.getItem("language") || "en";
async function sendMessage() {

    const messageBox = document.getElementById("message");
    const message = messageBox.value.trim();

    if (!message) return;

    document.getElementById("chat").innerHTML +=
        "<p><b>You:</b> " + message + "</p>";

    history.push({
        role: "user",
        content: message
    });

    messageBox.value = "";

    const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
  
     body: JSON.stringify({
    participantId,
    sessionId,
    language,
    message,
    history
})
    });

    const data = await response.json();

    document.getElementById("chat").innerHTML +=
        "<p><b>AI:</b> " + data.reply + "</p>";

    history.push({
        role: "assistant",
        content: data.reply
    });
}

</script>

<br><br>

<a href="index.html">
    <button>Return to Language Selection</button>
</a>

</body>
</html>
