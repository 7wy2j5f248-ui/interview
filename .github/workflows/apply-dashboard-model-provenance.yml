name: Apply dashboard model provenance

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/dashboard-interview-model-provenance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dashboard-interview-model-provenance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/apply-dashboard-model-provenance.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - run: node --test tests/*.test.mjs
      - run: |
          node --check api/statistics.js
          node --check api/analysis.js
          node --check server/corpus.js
          node --check researcher-analysis.js
      - run: |
          rm -rf node_modules
          rm -f package-lock.json
          rm -f .github/scripts/apply-dashboard-model-provenance.py
          rm -f .github/workflows/apply-dashboard-model-provenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show interview conditions in dashboard reports"
          git push
