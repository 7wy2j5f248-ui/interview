name: Apply model selection PR patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/configurable-model-selection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: |
          if [ ! -f supabase/migrations/20260719030000_add_researcher_model_selection.sql ]; then
            python .github/scripts/apply-configurable-model-selection-v2.py
          else
            echo "Model-selection patch is already present."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run tests
        run: node --test tests/*.test.mjs
      - name: Remove temporary build files
        if: always()
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          rm -f .github/scripts/apply-configurable-model-selection.py
          rm -f .github/scripts/apply-configurable-model-selection-v2.py
          rm -f .github/workflows/apply-configurable-model-selection.yml
      - name: Commit generated changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Clean model-selection implementation artifacts"
            git push origin HEAD:${{ github.head_ref }}
          fi
