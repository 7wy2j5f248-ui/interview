name: Apply model selection PR patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/configurable-model-selection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: |
          if [ ! -f supabase/migrations/20260719030000_add_researcher_model_selection.sql ]; then
            python .github/scripts/apply-configurable-model-selection-v2.py
          else
            echo "Model-selection patch is already present."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          set +e
          node --test tests/*.test.mjs 2>&1 | tee /tmp/model-selection-tests.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "### Test tail" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 /tmp/model-selection-tests.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Commit generated changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Make interview and analysis models researcher-configurable"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Enforce test result
        if: always() && steps.tests.outputs.status != '0'
        run: exit 1
