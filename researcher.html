<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Researcher Dashboard</title>
    <style>
        .message {
            margin-block: 1rem;
        }

        .message p {
            white-space: pre-wrap;
        }

        .englishTranslation {
            border-inline-start: 3px solid #cccccc;
            margin-block-start: 0.5rem;
            padding-inline-start: 0.75rem;
        }
    </style>
</head>
<body>

<h1>Researcher Dashboard</h1>

<p>Welcome to the researcher interface.</p>
<p>Add researcher dashboard</p>
<button id="participantsButton">Participants</button>
    <div id="participantsList"></div>

<div id="sessionsList"></div>

    <div id="messagesList"></div>
    
<script>

async function loadMessages(sessionId) {

    const response = await fetch("/api/messages?session=" + sessionId);

    if (!response.ok) {
        document.getElementById("messagesList").textContent =
            "Unable to load interview messages.";
        return;
    }

    const messages = await response.json();

    const messageList = document.getElementById("messagesList");

    messageList.innerHTML = "";

    messages.forEach(function(item) {

        const message = document.createElement("article");
        message.className = "message";

        const original = document.createElement("p");
        const speaker = document.createElement("strong");
        speaker.textContent = `${item.Speaker}: `;
        original.append(speaker, document.createTextNode(item.Message));
        message.appendChild(original);

        const language = typeof item.Language === "string"
            ? item.Language.trim().toLowerCase()
            : "";
        const translation = typeof item.EnglishTranslation === "string"
            ? item.EnglishTranslation.trim()
            : "";

        if (language && language !== "en" && translation) {
            const translationBlock = document.createElement("div");
            translationBlock.className = "englishTranslation";

            const translationLabel = document.createElement("strong");
            translationLabel.textContent = "English translation:";

            const translationText = document.createElement("p");
            translationText.textContent = translation;

            translationBlock.append(translationLabel, translationText);
            message.appendChild(translationBlock);
        }

        messageList.appendChild(message);

    });

}

async function loadSessions(participantId) {

    const response = await fetch("/api/sessions?participant=" + participantId);
    const sessions = await response.json();

    const sessionList = document.getElementById("sessionsList");

    sessionList.innerHTML = "";

    const uniqueSessions = [...new Set(sessions.map(item => item.Session))];

    uniqueSessions.forEach(function(session) {

        if (session) {
            sessionList.innerHTML += `<p><button class="sessionButton" data-id="${session}">${session}</button></p>`;
        }

    });

    document.querySelectorAll(".sessionButton").forEach(function(button) {

        button.addEventListener("click", function() {

            loadMessages(button.dataset.id);

        });

    });

}

document.getElementById("participantsButton").addEventListener("click", async function () {

    const response = await fetch("/api/participants");
    const participants = await response.json();

    const list = document.getElementById("participantsList");

    list.innerHTML = "";
    document.getElementById("sessionsList").innerHTML = "";
    document.getElementById("messagesList").innerHTML = "";

    const uniqueParticipants = [...new Set(participants.map(item => item.Participant))];

    uniqueParticipants.forEach(function(participant) {

        list.innerHTML += `<p><button class="participantButton" data-id="${participant}">${participant}</button></p>`;

    });

    document.querySelectorAll(".participantButton").forEach(function(button) {

        button.addEventListener("click", function() {

            loadSessions(button.dataset.id);

        });

    });

});

</script>
    
</body>
</html>
