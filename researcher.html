<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Researcher Dashboard</title>
</head>
<body>

<h1>Researcher Dashboard</h1>

<p>Welcome to the researcher interface.</p>
<p>Add researcher dashboard</p>
<button id="participantsButton">Participants</button>
<button>Sessions</button>
<button>Messages</button>
<button>Statistics</button>
    <div id="participantsList"></div>
<script>

document.getElementById("participantsButton").addEventListener("click", async function () {

    const response = await fetch("/api/participants");
    const participants = await response.json();

    const list = document.getElementById("participantsList");

    list.innerHTML = "";

   const uniqueParticipants = [...new Set(participants.map(item => item.Participant))];

uniqueParticipants.forEach(function(participant) {

    list.innerHTML += `<p>${participant}</p>`;

});

});

</script>
</body>
</html>
